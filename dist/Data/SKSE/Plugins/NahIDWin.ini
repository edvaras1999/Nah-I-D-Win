; NAH-I-D-WIN v0.5.0 - configuracao (tambem podes mudar tudo no menu MCM do SkyUI: NAH-I-D-WIN) (Poise + Postura + BleedOut)
; O jogo relê este arquivo sozinho em ate 2 segundos depois de o guardares (nao precisa reiniciar).
; Para ver o que acontece, abre o log: Documentos\My Games\Skyrim\SKSE\NahIDWin.log

[General]
Enabled=1
; 1 = o jogador tambem tem poise
Player=1
; 1 = os outros atores (inimigos, aliados, criaturas) tem poise
NPCs=1

[Stagger]
; COMO se provoca o stagger quando o poise chega a zero:
;   0 = (recomendado) o plugin avisa o mini-script NahIDWinBridge, que lanca um feitico de stagger do jogo
;   1 = EXPERIMENTAL, sem Papyrus: o plugin tenta tocar a animacao sozinho. Pode nao funcionar ou
;       fechar o jogo. Usa so num save de teste e diz-me o que aconteceu (o log mostra cada passo).
StaggerMode=1
; So para o modo 1: posicao da funcao na tabela do jogo e nome do evento de animacao
NativeSlot=1
NativeEvent=staggerStart
; Poise depois do stagger (1.0 = cheio)
ResetFraction=1.0
; Depois de um stagger PESADO, durante estes segundos NEM o poise NEM a postura sobem (imunidade)
ImmuneSeconds=2.5
; Stagger LEVE: cada golpe recebido sem bloquear (no maximo um a cada LightCooldownMs, por ator)
LightEnabled=1
LightPlayer=1
LightNPCs=1
LightCooldownMs=700
; Para o jogador o stagger leve e mais espacado (para nao ficar travado a andar enquanto leva golpes)
LightCooldownPlayerMs=1500
; Stagger MEDIO: golpe forte (power attack) ou golpe de escudo sem bloquear
MediumOnPowerAttack=1

[Poise]
; POISE = a barra rapida. Quebrou = stagger PESADO. Dificuldade do poise:
;   MaxScale* = tamanho da barra (mais baixo = quebra mais cedo); NPCTakenMult = quanto os NPCs sofrem
MaxScalePlayer=4.5
MaxScaleNPC=9.0
NPCTakenMult=2.5
; Poise maximo = massa da raca x MassMult + armadura x ArmorFraction (nunca menos que MinPoise)
MassMult=20.0
ArmorFraction=0.5
MinPoise=10.0
; Valor de ator usado como armadura (39 = DamageResist). Se o log mostrar vArmor=0 sempre, avisa-me.
ArmorActorValue=39
; Segundos para o poise encher de 0 a cheio
RegenSeconds=30.0
; Segundos sem levar golpes antes de comecar a regenerar
RegenDelaySeconds=2.0
; O jogador leva isto vezes mais dano de poise
PlayerTakenMult=1.5

[Posture]
; POSTURA = a barra lenta, estilo Sekiro. Cada golpe ENCHE-A e ela baixa sozinha.
; Quando enche por completo: BLEEDOUT (ajoelhado e indefeso). Estamina nao entra nisto.
Enabled=1
; DIFICULDADE: 1.0 = normal. 2.0 = a postura aguenta o dobro. 0.5 = quebra com metade.
Difficulty=1.0
; Postura maxima = Base + vida maxima x HealthFraction + armadura x ArmorFraction (depois x Difficulty)
Base=100.0
HealthFraction=0.3
ArmorFraction=0.3
; Quanto cada golpe enche: dano do golpe x DamageMult (golpe bloqueado: x BlockedMult tambem)
DamageMult=1.0
BlockedMult=0.12
; Com a vida baixa a postura enche mais depressa (1.0 = ate o dobro com a vida a zero; 0 = desligado)
LowHealthBonus=1.0
; Tempo para a postura baixar de cheia a zero, e a pausa antes de comecar a baixar
RegenSeconds=60.0
RegenDelaySeconds=3.0
; Postura depois do BleedOut (0 = vazia)
ResetFraction=0.0
; Ajustes por quem e: jogador / outros
ScalePlayer=5.0
ScaleNPC=5.0
; Duracao do BleedOut e segundos de imunidade depois de levantar
BleedOutSeconds=4.0
BleedOutImmuneSeconds=5.0

[Stamina]
; Golpe forte: custo EXTRA do mod (multiplo do custo base). 0 = so o custo do proprio jogo (fPowerAttackStaminaPenalty).
PowerAttackOwnCost=0.0
; Custo de estamina por bater, separado do poise. O jogador paga por CADA balanco de arma (mesmo sem acertar):
; isto usa um evento de animacao no script ponte (um evento por balanco, sem ciclos).
; NPCs: por omissao 0 (a estamina deles fica para os mods de estamina). Se puseres um valor, a DLL
; tira essa estamina ao NPC por cada golpe que ele desfecha.
Enabled=1
; Custo base de um balanco normal. O custo final = base x multiplicador do TIPO DE ARMA x golpe forte/escudo
; x (1 + armadura/100 x ArmorCostFactor)
SwingCostPlayer=8.0
HitCostNPC=0.0
; Multiplicador por tipo de arma (0 punhos, 1 espada 1m, 2 adaga, 3 machado 1m, 4 maca 1m, 5 espada 2m,
; 6 machado/martelo 2m, 7 arco, 8 cajado, 9 feitico, 10 escudo, 11 tocha, 12 besta)
TypeMult0=0.6
TypeMult1=1.0
TypeMult2=0.6
TypeMult3=1.2
TypeMult4=1.3
TypeMult5=1.6
TypeMult6=1.8
TypeMult7=0.8
TypeMult8=0.6
TypeMult9=0.0
TypeMult10=1.0
TypeMult11=0.5
TypeMult12=0.8
PowerAttackMult=1.5
BashMult=1.0
; Armadura pesada cansa mais: custo x (1 + armadura/100 x isto)
ArmorCostFactor=0.25
; A armadura abranda tambem a regeneracao de estamina do jogador (muda o valor StaminaRateMult).
; Se usas outro mod que gere a regeneracao, poe 0 aqui para nao haver conflito.
ArmorRegenEnabled=1
; regeneracao % = 100 / (1 + armadura/100 x isto)
ArmorRegenFactor=0.3

[Exhaustion]
; Estamina a zero = EXAUSTAO: durante alguns segundos nao podes atacar nem regenerar estamina.
; Os NPCs sem estamina levam stagger pesado.
Enabled=1
Seconds=2.5
CooldownSeconds=8.0
NPCs=1

[Knockback]
; Empurrao no stagger PESADO (poise quebrado), so quando o golpe for de um destes tipos:
Enabled=1
; 0 = sem empurrao. Valores tipicos: 0.5 leve, 1.0 medio, 2.0 forte
Force=1.0
; Tambem empurrar o jogador?
Player=1
; Golpe forte (inclui o carregado e o de corrida)
OnPowerAttack=1
; Atacante de raca grande (massa da raca >= GiantMassMin; gigantes, dragoes, mamutes...)
OnGiantCreature=1
GiantMassMin=3.0
; Arma de duas maos ou com peso >= HeavyWeaponMinWeight, MESMO em golpe normal (deixa as armas grandes muito fortes)
OnHeavyWeapon=0
HeavyWeaponMinWeight=15.0

[Parry]
; PARRY = janela de imunidade total que abre quando carregas no bloqueio (decidida so pelo tempo).
; Dentro da janela, golpes vindos da frente nao te causam dano de vida, estamina, poise, postura nem stagger.
; Fora da janela o bloqueio normal do jogo fica como esta.
Enabled=1
; Duracao da janela em milissegundos
WindowMs=250
; Tempo ate poderes abrir outra janela (100 a 250 e o normal). Baixo = parries em sequencia
CooldownMs=200
; 1 = a janela acaba quando largas o bloqueio (evita tocar sem parar)
RequireHeld=1
; So golpes vindos da frente contam (graus para cada lado)
FrontAngleDegrees=100
; 1 = dano de vida zero dentro da janela (feito na DLL)
NoDamage=1
; Efeito no atacante: fracao da postura maxima dele que enche, stagger leve (recuo) e estamina perdida. Nao mexe no poise.
AttackerPostureFraction=0.10
AttackerStagger=1
AttackerStaminaDrain=20.0
; O que tu recuperas no parry (fracao do maximo)
DefenderPostureRecoverFraction=0.15
DefenderPoiseRecoverFraction=0.25
DefenderStaminaRecoverFraction=0.25
; Faiscas e som no parry (formas proprias do NahIDWin.esp; os ficheiros vem do pacote de efeitos)
Effects=1

[Block]
; Bloqueio normal (sem parry): so o atacante gasta estamina; sem stagger.
DrainEnabled=1
AttackerStamina=10.0
PowerAttackMult=1.5

[Rage]
; FURIA: imunidade temporaria (poise e postura nao sobem e nao ha stagger) em troca de vida ou estamina.
Enabled=1
; Tecla do jogador (codigo DirectInput). 34 = G. Exemplos: 19 = R, 47 = V, 46 = C, 33 = F, 35 = H
Key=34
DurationSeconds=5.0
CooldownSeconds=30.0
; 0 = paga com vida (nunca te mata), 1 = paga com estamina
CostType=0
; Percentagem do maximo que custa
CostPercent=15.0
; Durante a furia o dano de vida recebido baixa esta percentagem (jogador e NPCs)
DamageReductionPercent=70.0
NPCDamageReductionPercent=50.0
; 1 = durante a furia golpes custam ZERO estamina
ZeroStamina=1
; NPCs ativam sozinhos quando estao perto de quebrar:
NPCs=1
; ... quando a postura passa desta fracao OU o poise desce abaixo desta fracao
NPCPostureTrigger=0.8
NPCPoiseTrigger=0.15
; probabilidade (%) por golpe recebido quando a condicao se cumpre
NPCChancePercent=50
NPCCooldownSeconds=45.0
; Custo para o NPC em % do maximo (0 = gratis)
NPCCostPercent=0.0

[Damage]
; Dano de poise de um golpe = peso da arma x WeightMult + base do tipo de arma + massa de quem bate x AttackerMassMult
; depois multiplicado por (1 + stagger da arma x WeaponStaggerMult) e pelos modificadores abaixo.
WeightMult=0.5
AttackerMassMult=1.0
; Base por tipo de arma: 0 punhos, 1 espada 1 mao, 2 adaga, 3 machado 1 mao, 4 maca 1 mao,
; 5 espada 2 maos, 6 machado/martelo 2 maos, 7 arco, 8 cajado, 9 besta
TypeBase0=3.0
TypeBase1=5.0
TypeBase2=3.0
TypeBase3=6.0
TypeBase4=7.0
TypeBase5=10.0
TypeBase6=12.0
TypeBase7=4.0
TypeBase8=3.0
TypeBase9=7.0
; Punhos e criaturas: dano fisico da raca x UnarmedMult (criaturas tambem somam CreatureBase)
UnarmedMult=1.0
CreatureBase=6.0
; Dano fixo de feiticos
MagicDamage=4.0
WeaponStaggerMult=1.0
PowerAttackMult=2.0
BashMult=1.5
; Golpe bloqueado: quanto poise gasta a quem bloqueia (e nunca da stagger). O atacante nunca perde poise nem postura.
BlockedMult=0.15
SneakMult=1.0
; Flechas e outros projeteis
RangedMult=0.8

[TrueHUD]
; Barra especial do TrueHUD LE = POSTURA (e preciso ativar as "special bars" no menu do TrueHUD).
Enabled=1
ShowForPlayer=1
FlashOnBreak=1
; Qual mostrar no TrueHUD: 1 = postura (recomendado), 0 = poise, 2 = a que estiver mais perto de quebrar
Bar=1
; A barra pisca quando o poise desce abaixo desta fracao (0.3 = 30%). 0 = desligado
PoiseWarnFraction=0.3
; Linhas proprias desenhadas por codigo, por baixo da estamina do jogador: POISE e FURIA.
SecondBar=0
BarPoise=1
BarRage=1
; Posicao/tamanho no ecra do jogador (pixeis do HUD, ecra 1280x720)
SecondBarX=490
SecondBarY=640
SecondBarWidth=300
SecondBarHeight=6
; EXPERIMENTAL: as mesmas linhas por baixo dos inimigos (projeta a posicao da cabeca no ecra).
; Se der problemas poe EnemyBars=0.
EnemyBars=0
EnemyBarWidth=110
EnemyBarHeight=4
; Pixeis para baixo a partir da cabeca (aumenta para descer a barra, negativo para subir)
EnemyBarOffsetY=14
EnemyBarMax=8

[Health]
; Dificuldade PROPRIA (independente da dificuldade do jogo) por GMST, como o Inpa Sekiro, sem contas de devolucao.
Enabled=1
; Multiplicador do dano de vida que o jogador RECEBE (1.0 = normal)
TakenMult=1.0
; Multiplicador do dano de vida que o jogador CAUSA
DealtMult=1.0
; Dano extra a um alvo em BleedOut (1.0 = sem extra; 2.0 = dobro)
BleedOutDamageMult=1.0

[Menu]
; Idioma do menu MCM: 0 = English, 1 = Portugues (BR)
Language=0

[Diagnostics]
; 1 = nao contar os feiticos de stagger deste proprio mod como dano
IgnoreOwnSpells=1
; Diagnostico do teste: escreve no log o que acontece. Podes desligar depois (Enabled=0).
Enabled=1
; Quantos golpes escrever no log por sessao (0 = nenhum)
LogHitsMax=400
; De quantos em quantos segundos escrever o resumo (0 = nunca)
SummarySeconds=30
; 1 = despeja as funcoes de animacao do jogador no log (serve para a versao sem Papyrus)
DumpVtable=0
; 1 = escreve no log cada evento que afeta o jogador (para descobrir a queda a meio dos combos)
LogPlayerEvents=1

[Inpa]
; 1 = parry, bloqueio, dificuldade e efeitos vem do Inpa Sekiro Combat (fundido no NahIDWin.esp).
;     A DLL so le o estado do parry dele e aplica postura/stagger/estamina ao atacante.
; 0 = modo antigo (parry e dano proprios da DLL).
Mode=1
; Regista cada dano de vida que o jogador leva (para achar "dano a duplicar"). So com Diagnostics Enabled=1.
LogPlayerDamage=1
